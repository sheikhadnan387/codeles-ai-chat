services:
  postgres:
    image: postgres:16-alpine
    container_name: codeles-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeles_ai
    ports:
      - "5432:5432"
    volumes:
      - codeles-ai-postgres-data:/var/lib/postgresql/data

volumes:
  codeles-ai-postgres-data:
